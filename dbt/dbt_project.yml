name: shop
version: "1.0.0"
config-version: 2
profile: shop

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]
# в образе Airflow пакеты зашиты при сборке (airflow/Dockerfile)
packages-install-path: "{{ env_var('DBT_PACKAGES_PATH', 'dbt_packages') }}"

vars:
  # бизнес-день считаем по Москве: заказ в 01:00 МСК относится к "сегодня", а не ко "вчера" по UTC
  business_tz: "Europe/Moscow"
  # статусы, которые считаются выручкой: деньги получены (отменённые и неоплаченные - нет)
  revenue_statuses: ["paid", "shipped", "delivered"]
  # возраст, после которого заказ считается завершённым: 99-й перцентиль времени до финального
  # статуса (notebooks/02_funnel.ipynb)
  funnel_maturity_days: 9

models:
  shop:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: ephemeral
    marts:
      +schema: marts
      +materialized: table
