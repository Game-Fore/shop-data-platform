# Подключение dbt к ClickHouse. Секреты берутся из окружения контейнера (.env -> compose).
# В ClickHouse "schema" = database: модели пишутся в базы staging / marts (см. dbt_project.yml).
shop:
  target: dev
  outputs:
    dev:
      type: clickhouse
      driver: http
      host: "{{ env_var('DBT_CLICKHOUSE_HOST', 'clickhouse') }}"
      port: "{{ env_var('DBT_CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD') }}"
      schema: analytics
      threads: 4
