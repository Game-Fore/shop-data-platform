models:
  # ---------- core ----------
  - name: fct_orders
    description: >
      Заказы за всю историю (одна строка на заказ), включая удалённые в источнике.
      Состояние - последняя версия из журнала CDC, время этапов - из переходов статусов.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "paid_at <= shipped_at and shipped_at <= delivered_at"
          config:
            description: Статусы идут по порядку (NULL - этап не наступил, не ошибка).
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ["new", "paid", "shipped", "delivered", "cancelled"]
      - name: is_revenue
        description: Заказ приносит выручку (статус из var revenue_statuses).
      - name: is_deleted
        description: Заказ удалён в Postgres (остался только в журнале CDC).
      - name: order_total
        data_tests: [not_null, non_negative]
      - name: items_total
        description: Сумма позиций; NULL у удалённых заказов (позиции удалены каскадом).
      - name: order_date
        description: Дата создания в бизнес-таймзоне.
        data_tests: [not_null]
      - name: customer_order_number
        description: Порядковый номер заказа клиента (1 - первый, включая отменённые).

  - name: fct_order_items
    description: Позиции заказов с атрибутами заказа и товара.
    columns:
      - name: order_item_id
        data_tests: [not_null, unique]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: quantity
        data_tests: [non_negative]
      - name: line_total
        data_tests: [non_negative]

  - name: dim_customers
    description: Клиенты с агрегатами по заказам и покупкам. Без персональных данных.
    columns:
      - name: customer_id
        data_tests: [not_null, unique]
      - name: purchases_count
        description: Число заказов с выручкой.
      - name: lifetime_revenue
        data_tests: [non_negative]
      - name: cohort_month
        description: Месяц первой покупки; NULL, если покупок не было.
      - name: days_since_last_purchase
        description: Recency для RFM, считается от даты среза (день последнего заказа в данных).

  - name: dim_products
    description: Товары с продажами за всю историю.
    columns:
      - name: product_id
        data_tests: [not_null, unique]
      - name: revenue
        data_tests: [non_negative]

  # ---------- sales ----------
  - name: mart_sales_daily
    description: >
      Продажи по дням, сетка без пропусков. Метрики последних дней дозревают
      (заказы ещё оплачиваются и отменяются), поэтому витрина пересобирается целиком.
    columns:
      - name: date
        data_tests: [not_null, unique]
      - name: gmv
        description: Сумма всех оформленных заказов, включая отменённые.
        data_tests: [non_negative]
      - name: revenue
        description: Сумма заказов со статусом из var revenue_statuses.
        data_tests: [non_negative]
      - name: avg_order_value
        description: revenue / paid_orders; NULL в дни без оплаченных заказов.
      - name: cancel_rate
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: is_complete_period
        description: День закончился (false для дня среза, то есть дня последнего заказа в данных).
      - name: is_full_week
        description: Неделя (пн-вс) целиком внутри данных; для недельных графиков без ложного спада на краях.

  - name: mart_order_funnel
    description: >
      Воронка заказа по дням: сколько заказов дошло до этапа. Для конверсии брать только
      is_matured: у свежих заказов история ещё не закончилась (правое цензурирование).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_date, is_matured, stage]
    columns:
      - name: stage
        data_tests:
          - accepted_values:
              arguments:
                values: ["Создан", "Оплачен", "Отгружен", "Доставлен"]
      - name: is_matured
        description: Заказ старше var funnel_maturity_days дней от последнего заказа в данных.
      - name: orders
        data_tests: [non_negative]
      - name: created_orders
        description: Заказов создано в тот же день; знаменатель конверсии этапа.

  # ---------- customers ----------
  - name: mart_cohort_retention
    description: >
      Месячный retention когорт по месяцу первой покупки. Строки есть только для наблюдаемых
      месяцев: наблюдаемый месяц без покупок = 0, ещё не наступивший = строки нет.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cohort_month, month_offset]
    columns:
      - name: month_offset
        description: Сколько месяцев прошло от месяца когорты (0 - сам месяц первой покупки).
      - name: retention_rate
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: is_complete_period
        description: Месяц активности наблюдается целиком (false для месяца даты среза).

  - name: mart_customer_rfm
    description: >
      RFM-сегментация покупателей (клиенты хотя бы с одной покупкой). R и M - квинтили,
      F - пороги 1 | 2 | 3-4 | 5-7 | 8+. Правила выбраны в notebooks/04_rfm.ipynb.
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: recency_days
        description: Дней с последней покупки (от сегодняшней даты в бизнес-таймзоне).
        data_tests: [non_negative]
      - name: r_score
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: f_score
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: m_score
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: segment
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Чемпионы", "Лояльные", "Новички", "Под угрозой", "Требуют внимания", "Засыпают", "Потерянные"]
