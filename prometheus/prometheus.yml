global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # consumer запущен на хосте, а не в контейнере
  - job_name: consumer
    static_configs:
      - targets: ["host.docker.internal:8000"]

  # лаг consumer group снаружи consumer'а: виден, даже когда consumer упал
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
